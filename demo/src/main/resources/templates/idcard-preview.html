<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ID Card Preview</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .id-card {
            width: 350px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            background: white;
            transition: transform 0.2s;
        }
        .id-card:hover {
            transform: translateY(-4px);
        }
        .card-header {
            padding: 20px;
            text-align: center;
            color: white;
        }
        .card-header h2 {
            font-size: 18px;
            margin-bottom: 4px;
        }
        .card-header p {
            font-size: 11px;
            opacity: 0.9;
        }
        .card-body {
            padding: 20px;
            text-align: center;
        }
        .photo-container {
            width: 120px;
            height: 140px;
            margin: 0 auto 16px;
            border-radius: 8px;
            overflow: hidden;
            border: 3px solid #e0e7ff;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .photo-placeholder {
            color: #9ca3af;
            font-size: 14px;
        }
        .profile-name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .profile-reg {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        .profile-type {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .type-STUDENT { background: #dbeafe; color: #1e40af; }
        .type-EMPLOYEE { background: #d1fae5; color: #065f46; }
        .type-USER { background: #f3e8ff; color: #6b21a8; }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 12px 0;
            text-align: left;
        }
        .info-item {
            font-size: 11px;
        }
        .info-item .label {
            color: #6b7280;
            font-weight: 600;
        }
        .info-item .value {
            color: #111827;
        }
        .card-footer {
            padding: 16px 20px;
            text-align: center;
            border-top: 1px solid #e5e7eb;
        }
        .qr-section {
            margin-bottom: 8px;
        }
        .qr-section img {
            width: 80px;
            height: 80px;
        }
        .barcode-section img {
            width: 200px;
            height: 40px;
        }
        .footer-text {
            font-size: 9px;
            color: #9ca3af;
            margin-top: 4px;
        }
    </style>
</head>
<body>
<div class="id-card">
    <!-- Header -->
    <div class="card-header"
         th:style="'background: linear-gradient(135deg, ' + (${profile.template?.primaryColor} ?: '#1d4ed8') + ', ' + (${profile.template?.secondaryColor} ?: '#6366f1') + ');'">
        <h2 th:text="${profile.template?.organizationName} ?: 'ORGANIZATION'">ORGANIZATION</h2>
        <p th:if="${profile.template?.tagline}" th:text="${profile.template?.tagline}">Tagline</p>
    </div>

    <!-- Body -->
    <div class="card-body" th:style="'color: ' + (${profile.template?.textColor} ?: '#111827') + ';'">
        <!-- Photo -->
        <div class="photo-container">
            <img th:if="${profile.hasPhoto()}" th:src="@{'/uploads/photos/' + ${profile.photoFileName}}" alt="Photo"/>
            <span class="photo-placeholder" th:unless="${profile.hasPhoto()}">[No Photo]</span>
        </div>

        <!-- Name & Reg Number -->
        <div class="profile-name" th:text="${profile.fullName}">Full Name</div>
        <div class="profile-reg" th:text="${profile.registrationNumber}">REG-000</div>

        <!-- Type Badge -->
        <div class="profile-type" th:classappend="'type-' + ${profile.type}"
             th:text="${profile.type}">TYPE</div>

        <!-- Info Grid -->
        <div class="info-grid">
            <div class="info-item" th:if="${profile.department}">
                <div class="label">Department</div>
                <div class="value" th:text="${profile.department}">Dept</div>
            </div>
            <div class="info-item" th:if="${profile.title}">
                <div class="label">Title</div>
                <div class="value" th:text="${profile.title}">Title</div>
            </div>
            <div class="info-item" th:if="${profile.email}">
                <div class="label">Email</div>
                <div class="value" th:text="${profile.email}">Email</div>
            </div>
            <div class="info-item" th:if="${profile.phone}">
                <div class="label">Phone</div>
                <div class="value" th:text="${profile.phone}">Phone</div>
            </div>
            <div class="info-item" th:if="${profile.bloodGroup}">
                <div class="label">Blood Group</div>
                <div class="value" th:text="${profile.bloodGroup}">Blood</div>
            </div>
            <div class="info-item" th:if="${profile.dateOfBirth}">
                <div class="label">DOB</div>
                <div class="value" th:text="${#temporals.format(profile.dateOfBirth, 'dd-MMM-yyyy')}">DOB</div>
            </div>
        </div>

        <!-- Dates -->
        <div style="font-size: 10px; color: #6b7280; margin-top: 8px;">
            <span th:if="${profile.issueDate}">Issued: <span th:text="${#temporals.format(profile.issueDate, 'dd-MMM-yyyy')}">Issue</span></span>
            <span th:if="${profile.expiryDate}"> | Expires: <span th:text="${#temporals.format(profile.expiryDate, 'dd-MMM-yyyy')}">Expiry</span></span>
        </div>
    </div>

    <!-- Footer -->
    <div class="card-footer">
        <div class="qr-section">
            <img th:src="@{'/api/qrcode/' + ${profile.uuid}}" alt="QR Code"/>
        </div>
        <div class="barcode-section">
            <img th:src="@{'/api/barcode/' + ${profile.id}}" alt="Barcode"/>
        </div>
        <div class="footer-text">This ID card is property of the organization. If found, please return.</div>
    </div>
</div>
</body>
</html>
