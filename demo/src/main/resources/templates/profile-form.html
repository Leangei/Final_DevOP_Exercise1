<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Profile Form - ID Card System</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',sans-serif; background:#f0f2f5; min-height:100vh; }
        .navbar { background:linear-gradient(135deg,#1d4ed8,#6366f1); color:white; padding:16px 32px; display:flex; justify-content:space-between; align-items:center; }
        .navbar h1 { font-size:20px; }
        .navbar a { color:white; text-decoration:none; font-size:14px; opacity:0.9; margin-left:16px; }
        .navbar a:hover { opacity:1; }
        .container { max-width:800px; margin:0 auto; padding:24px; }
        .card { background:white; border-radius:12px; padding:32px; box-shadow:0 2px 8px rgba(0,0,0,0.08); }
        .card h2 { font-size:22px; color:#1a1a2e; margin-bottom:24px; }
        .form-group { margin-bottom:16px; }
        .form-group label { display:block; font-size:14px; font-weight:600; color:#374151; margin-bottom:4px; }
        .form-group input, .form-group select { width:100%; padding:10px 12px; border:1px solid #d1d5db; border-radius:8px; font-size:14px; }
        .form-group input:focus, .form-group select:focus { outline:none; border-color:#6366f1; box-shadow:0 0 0 3px rgba(99,102,241,0.1); }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
        .btn { display:inline-block; padding:10px 20px; border-radius:8px; text-decoration:none; font-size:14px; font-weight:600; cursor:pointer; border:none; }
        .btn-primary { background:#1d4ed8; color:white; }
        .btn-primary:hover { background:#1e40af; }
        .btn-secondary { background:#6b7280; color:white; }
        .btn-secondary:hover { background:#4b5563; }
        .form-actions { display:flex; gap:12px; margin-top:24px; padding-top:16px; border-top:1px solid #e5e7eb; }
        .nav-links { display:flex; gap:8px; }
        .photo-preview { width:100px; height:100px; border-radius:8px; object-fit:cover; border:2px solid #e5e7eb; margin-top:8px; }
    </style>
</head>
<body>
<div class="navbar">
    <h1>📇 ID Card Management</h1>
    <div class="nav-links">
        <a href="/">🏠 Home</a>
        <a href="/web/profiles">👤 Profiles</a>
        <a href="/web/templates">🎨 Templates</a>
    </div>
</div>
<div class="container">
    <div class="card">
        <h2 th:if="${profile.id == null}">➕ New Profile</h2>
        <h2 th:if="${profile.id != null}">✏️ Edit Profile</h2>

        <form th:action="${action}" method="post" enctype="multipart/form-data">
            <div class="form-row">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" name="fullName" th:value="${profile.fullName}" required placeholder="Enter full name"/>
                </div>
                <div class="form-group">
                    <label>Profile Type *</label>
                    <select name="type" required>
                        <option value="">-- Select Type --</option>
                        <option th:each="t : ${types}" th:value="${t}" th:text="${t}" th:selected="${profile.type == t}"></option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" th:value="${profile.email}" placeholder="email@example.com"/>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" name="phone" th:value="${profile.phone}" placeholder="Phone number"/>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Department</label>
                    <input type="text" name="department" th:value="${profile.department}" placeholder="e.g. ENG, CS, HR"/>
                </div>
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" name="title" th:value="${profile.title}" placeholder="Job title or class"/>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Blood Group</label>
                    <input type="text" name="bloodGroup" th:value="${profile.bloodGroup}" placeholder="e.g. A+"/>
                </div>
                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" name="dateOfBirth" th:value="${profile.dateOfBirth}"/>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Expiry Date</label>
                    <input type="date" name="expiryDate" th:value="${profile.expiryDate}"/>
                </div>
                <div class="form-group">
                    <label>Barcode Type</label>
                    <select name="barcodeType">
                        <option th:each="b : ${barcodeTypes}" th:value="${b}" th:text="${b}" th:selected="${profile.barcodeType == b}"></option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Card Template</label>
                    <select name="templateId">
                        <option value="">-- Default --</option>
                        <option th:each="t : ${templates}" th:value="${t.id}" th:text="${t.name}" th:selected="${profile.template?.id == t.id}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Photo (JPEG/PNG)</label>
                    <input type="file" name="photoFile" accept="image/jpeg,image/png"/>
                    <img th:if="${profile.hasPhoto()}" th:src="@{'/uploads/photos/' + ${profile.photoFileName}}" class="photo-preview" alt="Current photo"/>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">💾 Save Profile</button>
                <a href="/web/profiles" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
