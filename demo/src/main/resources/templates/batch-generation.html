<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Batch Generation - ID Card System</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',sans-serif; background:#f0f2f5; }
        .navbar { background:linear-gradient(135deg,#1d4ed8,#6366f1); color:white; padding:16px 32px; display:flex; justify-content:space-between; }
        .navbar h1 { font-size:20px; }
        .navbar a { color:white; text-decoration:none; font-size:14px; opacity:0.9; margin-left:16px; }
        .container { max-width:900px; margin:0 auto; padding:24px; }
        .card { background:white; border-radius:12px; padding:32px; box-shadow:0 2px 8px rgba(0,0,0,0.08); }
        .card h2 { font-size:22px; color:#1a1a2e; margin-bottom:8px; }
        .card p { color:#6b7280; font-size:14px; margin-bottom:20px; }
        .btn { display:inline-block; padding:10px 20px; border-radius:8px; text-decoration:none; font-size:14px; font-weight:600; border:none; cursor:pointer; }
        .btn-primary { background:#1d4ed8; color:white; }
        .btn-primary:hover { background:#1e40af; }
        .btn-success { background:#059669; color:white; }
        .btn-success:hover { background:#047857; }
        .alert { padding:12px 16px; border-radius:8px; margin-bottom:16px; }
        .alert-error { background:#fee2e2; color:#991b1b; border:1px solid #fecaca; }
        .profile-list { max-height:400px; overflow-y:auto; border:1px solid #e5e7eb; border-radius:8px; }
        .profile-item { display:flex; align-items:center; padding:10px 16px; border-bottom:1px solid #f3f4f6; }
        .profile-item:hover { background:#f9fafb; }
        .profile-item input { margin-right:12px; }
        .profile-item .info { flex:1; }
        .profile-item .name { font-size:14px; font-weight:600; color:#374151; }
        .profile-item .reg { font-size:12px; color:#6b7280; font-family:monospace; }
        .form-actions { margin-top:20px; display:flex; gap:12px; }
    </style>
</head>
<body>
<div class="navbar">
    <h1>📇 ID Card Management</h1>
    <div><a href="/">🏠 Home</a><a href="/web/profiles">👤 Profiles</a><a href="/web/batch">📦 Batch</a></div>
</div>
<div class="container">
    <div class="card">
        <h2>📦 Batch ID Card Generation</h2>
        <p>Select profiles to generate ID cards in bulk. All selected cards will be downloaded as a ZIP file.</p>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form id="batchForm" th:action="@{/api/pdf/batch}" method="post">
            <div class="profile-list" th:if="${!#lists.isEmpty(profiles)}">
                <div class="profile-item" th:each="p : ${profiles}">
                    <input type="checkbox" name="profileIds" th:value="${p.id}" class="profile-checkbox"/>
                    <div class="info">
                        <div class="name" th:text="${p.fullName}">Name</div>
                        <div class="reg" th:text="${p.registrationNumber}">REG</div>
                    </div>
                    <span class="badge" th:classappend="'badge-' + ${p.type.name().toLowerCase()}" th:text="${p.type}" style="font-size:11px;padding:2px 8px;border-radius:10px;">TYPE</span>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(profiles)}" style="text-align:center;padding:40px;color:#6b7280;">
                <p>No profiles available. Create profiles first.</p>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-success" onclick="return submitBatch(event)">📥 Generate PDFs (ZIP)</button>
                <button type="button" class="btn btn-primary" onclick="selectAll(true)">Select All</button>
                <button type="button" class="btn btn-primary" onclick="selectAll(false)">Deselect All</button>
                <a href="/" class="btn btn-primary">🏠 Home</a>
            </div>
        </form>

        <div th:if="${selectedIds}" style="margin-top:16px;padding:12px;background:#f0fdf4;border-radius:8px;border:1px solid #bbf7d0;">
            ✅ <span th:text="${#lists.size(selectedIds)}"></span> profile(s) selected. 
            <a th:href="${generateUrl}" class="btn btn-sm btn-success" style="margin-left:8px;" onclick="event.preventDefault();document.getElementById('batchForm').submit();">Generate ZIP</a>
        </div>
    </div>
</div>
<script>
function selectAll(checked) {
    document.querySelectorAll('.profile-checkbox').forEach(cb => cb.checked = checked);
}
function submitBatch(event) {
    var checked = document.querySelectorAll('.profile-checkbox:checked');
    if (checked.length === 0) {
        alert('Please select at least one profile');
        event.preventDefault();
        return false;
    }
    return true;
}
</script>
<style>
.badge-student { background:#dbeafe; color:#1e40af; }
.badge-employee { background:#d1fae5; color:#065f46; }
.badge-user { background:#f3e8ff; color:#6b21a8; }
</style>
</body>
</html>
