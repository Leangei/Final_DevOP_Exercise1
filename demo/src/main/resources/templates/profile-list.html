<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Profiles - ID Card System</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',sans-serif; background:#f0f2f5; min-height:100vh; }
        .navbar { background:linear-gradient(135deg,#1d4ed8,#6366f1); color:white; padding:16px 32px; display:flex; justify-content:space-between; align-items:center; }
        .navbar h1 { font-size:20px; }
        .navbar a { color:white; text-decoration:none; font-size:14px; opacity:0.9; margin-left:16px; }
        .navbar a:hover { opacity:1; }
        .container { max-width:1200px; margin:0 auto; padding:24px; }
        .header-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
        .header-bar h2 { font-size:24px; color:#1a1a2e; }
        .btn { display:inline-block; padding:10px 20px; border-radius:8px; text-decoration:none; font-size:14px; font-weight:600; cursor:pointer; border:none; }
        .btn-primary { background:#1d4ed8; color:white; }
        .btn-primary:hover { background:#1e40af; }
        .btn-success { background:#059669; color:white; }
        .btn-danger { background:#dc2626; color:white; }
        .btn-sm { padding:6px 12px; font-size:12px; }
        .alert { padding:12px 16px; border-radius:8px; margin-bottom:16px; font-size:14px; }
        .alert-success { background:#d1fae5; color:#065f46; border:1px solid #a7f3d0; }
        .alert-error { background:#fee2e2; color:#991b1b; border:1px solid #fecaca; }
        table { width:100%; border-collapse:collapse; background:white; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.08); }
        th { background:#f8fafc; color:#374151; font-size:12px; text-transform:uppercase; letter-spacing:0.5px; padding:12px 16px; text-align:left; border-bottom:2px solid #e5e7eb; }
        td { padding:12px 16px; border-bottom:1px solid #f3f4f6; font-size:14px; color:#374151; }
        tr:hover td { background:#f9fafb; }
        .badge { display:inline-block; padding:2px 8px; border-radius:12px; font-size:11px; font-weight:600; }
        .badge-student { background:#dbeafe; color:#1e40af; }
        .badge-employee { background:#d1fae5; color:#065f46; }
        .badge-user { background:#f3e8ff; color:#6b21a8; }
        .actions { display:flex; gap:6px; flex-wrap:wrap; }
        .empty-state { text-align:center; padding:60px 20px; background:white; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.08); }
        .empty-state p { color:#6b7280; margin-bottom:16px; }
        .photo-thumb { width:40px; height:40px; border-radius:50%; object-fit:cover; background:#e5e7eb; }
        .nav-links { display:flex; gap:8px; }
    </style>
</head>
<body>
<div class="navbar">
    <h1>📇 ID Card Management</h1>
    <div class="nav-links">
        <a href="/">🏠 Home</a>
        <a href="/web/profiles">👤 Profiles</a>
        <a href="/web/templates">🎨 Templates</a>
        <a href="/web/batch">📦 Batch</a>
    </div>
</div>
<div class="container">
    <div class="header-bar">
        <h2>👤 Profile Management</h2>
        <a href="/web/profiles/new" class="btn btn-primary">+ New Profile</a>
    </div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <table th:if="${!#lists.isEmpty(profiles)}">
        <thead>
        <tr>
            <th>Photo</th>
            <th>Full Name</th>
            <th>Reg. Number</th>
            <th>Type</th>
            <th>Department</th>
            <th>Template</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="profile : ${profiles}">
            <td>
                <img th:if="${profile.hasPhoto()}" th:src="@{'/uploads/photos/' + ${profile.photoFileName}}" class="photo-thumb" alt="Photo"/>
                <span th:unless="${profile.hasPhoto()}" style="color:#9ca3af;font-size:12px;">No photo</span>
            </td>
            <td th:text="${profile.fullName}">Name</td>
            <td th:text="${profile.registrationNumber}" style="font-family:monospace;font-size:13px;">REG</td>
            <td><span class="badge" th:classappend="'badge-' + ${profile.type.name().toLowerCase()}" th:text="${profile.type}">TYPE</span></td>
            <td th:text="${profile.department} ?: '-'">Dept</td>
            <td th:text="${profile.template?.name} ?: '-'">Template</td>
            <td>
                <div class="actions">
                    <a th:href="@{'/preview/' + ${profile.id}}" class="btn btn-sm btn-primary" target="_blank">👁️ Preview</a>
                    <a th:href="@{'/web/profiles/' + ${profile.id} + '/edit'}" class="btn btn-sm btn-success">✏️ Edit</a>
                    <a th:href="@{'/web/profiles/' + ${profile.id} + '/delete'}" class="btn btn-sm btn-danger" onclick="return confirm('Delete?')">🗑️</a>
                    <a th:href="@{'/api/pdf/' + ${profile.id}}" class="btn btn-sm btn-primary" target="_blank">📄 PDF</a>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
    <div th:if="${#lists.isEmpty(profiles)}" class="empty-state">
        <p>😕 No profiles found. Create your first ID card profile!</p>
        <a href="/web/profiles/new" class="btn btn-primary">+ Create Profile</a>
    </div>
</div>
</body>
</html>
