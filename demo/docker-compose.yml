version: '3.8'

services:

  web:
    image: ubuntu:24.04
    container_name: web-server

    ports:
      - "2222:22"

    tty: true

    command: >
      bash -c "
      export DEBIAN_FRONTEND=noninteractive &&
      ln -fs /usr/share/zoneinfo/Asia/Phnom_Penh /etc/localtime &&
      apt update &&
      apt install -y git openssh-server wget php php-mysql php-mbstring php-xml php-cli &&
      mkdir /var/run/sshd &&
      echo 'root:Hello@123' | chpasswd &&
      /usr/sbin/sshd &&
      tail -f /dev/null
      "

    depends_on:
      - mysql

  nginx:
    image: nginx:latest
    container_name: nginx

    ports:
      - "8443:8080"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - web

  mysql:
    image: mysql:8

    container_name: mysql-db

    environment:
      MYSQL_ROOT_PASSWORD: Hello@123
      MYSQL_DATABASE: A-MENG_leangei-db

    ports:
      - "3307:3306"