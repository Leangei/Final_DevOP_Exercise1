- name: Deploy Application to Web Server
  hosts: webserver

  tasks:
    - name: Verify JAR is deployed
      stat:
        path: /app/demo-0.0.1-SNAPSHOT.jar
      register: jar_file

    - name: Report JAR deployment status
      debug:
        msg: "JAR file {{ 'exists' if jar_file.stat.exists else 'MISSING' }} at /app/demo-0.0.1-SNAPSHOT.jar ({{ jar_file.stat.size }} bytes)"

    - name: Backup MySQL database via mysqldump
      command: >
        mysqldump -h mysql-db -u root -pHello@123 A-MENG_leangei-db
      register: backup_output

    - name: Save backup to file
      copy:
        content: "{{ backup_output.stdout }}"
        dest: /app/backup.sql

    - name: Verify backup
      stat:
        path: /app/backup.sql
      register: backup_file

    - name: Backup complete
      debug:
        msg: "MySQL backup saved to /app/backup.sql ({{ backup_file.stat.size }} bytes)"