<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Template Form - ID Card System</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',sans-serif; background:#f0f2f5; }
        .navbar { background:linear-gradient(135deg,#1d4ed8,#6366f1); color:white; padding:16px 32px; display:flex; justify-content:space-between; }
        .navbar h1 { font-size:20px; }
        .navbar a { color:white; text-decoration:none; font-size:14px; opacity:0.9; margin-left:16px; }
        .container { max-width:700px; margin:0 auto; padding:24px; }
        .card { background:white; border-radius:12px; padding:32px; box-shadow:0 2px 8px rgba(0,0,0,0.08); }
        .card h2 { font-size:22px; color:#1a1a2e; margin-bottom:24px; }
        .form-group { margin-bottom:16px; }
        .form-group label { display:block; font-size:14px; font-weight:600; color:#374151; margin-bottom:4px; }
        .form-group input, .form-group select { width:100%; padding:10px 12px; border:1px solid #d1d5db; border-radius:8px; font-size:14px; }
        .form-group input:focus { outline:none; border-color:#6366f1; }
        .form-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
        .btn { padding:10px 20px; border-radius:8px; text-decoration:none; font-size:14px; font-weight:600; border:none; cursor:pointer; }
        .btn-primary { background:#1d4ed8; color:white; }
        .btn-secondary { background:#6b7280; color:white; }
        .form-actions { display:flex; gap:12px; margin-top:24px; padding-top:16px; border-top:1px solid #e5e7eb; }
    </style>
</head>
<body>
<div class="navbar">
    <h1>📇 ID Card Management</h1>
    <div><a href="/">🏠 Home</a><a href="/web/templates">🎨 Templates</a></div>
</div>
<div class="container">
    <div class="card">
        <h2>➕ New Template</h2>
        <form th:action="${action}" method="post">
            <div class="form-group">
                <label>Code *</label>
                <input type="text" name="code" required placeholder="e.g. DEFAULT, DARK, MODERN"/>
            </div>
            <div class="form-group">
                <label>Name *</label>
                <input type="text" name="name" required placeholder="Template display name"/>
            </div>
            <div class="form-group">
                <label>Organization Name</label>
                <input type="text" name="organizationName" placeholder="e.g. Institute of Technology"/>
            </div>
            <div class="form-group">
                <label>Layout</label>
                <select name="layout">
                    <option value="VERTICAL">Vertical</option>
                    <option value="HORIZONTAL">Horizontal</option>
                </select>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Primary Color</label>
                    <input type="color" name="primaryColor" value="#1d4ed8"/>
                </div>
                <div class="form-group">
                    <label>Secondary Color</label>
                    <input type="color" name="secondaryColor" value="#e0e7ff"/>
                </div>
                <div class="form-group">
                    <label>Text Color</label>
                    <input type="color" name="textColor" value="#111827"/>
                </div>
            </div>
            <div class="form-group">
                <label>Tagline</label>
                <input type="text" name="tagline" placeholder="Organization motto or tagline"/>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">💾 Save Template</button>
                <a href="/web/templates" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
