<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Templates - ID Card System</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',sans-serif; background:#f0f2f5; }
        .navbar { background:linear-gradient(135deg,#1d4ed8,#6366f1); color:white; padding:16px 32px; display:flex; justify-content:space-between; align-items:center; }
        .navbar h1 { font-size:20px; }
        .navbar a { color:white; text-decoration:none; font-size:14px; opacity:0.9; margin-left:16px; }
        .container { max-width:1000px; margin:0 auto; padding:24px; }
        .header-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
        .header-bar h2 { font-size:24px; color:#1a1a2e; }
        .btn { display:inline-block; padding:10px 20px; border-radius:8px; text-decoration:none; font-size:14px; font-weight:600; border:none; cursor:pointer; }
        .btn-primary { background:#1d4ed8; color:white; }
        .btn-danger { background:#dc2626; color:white; }
        .btn-sm { padding:6px 12px; font-size:12px; }
        .alert { padding:12px 16px; border-radius:8px; margin-bottom:16px; }
        .alert-success { background:#d1fae5; color:#065f46; border:1px solid #a7f3d0; }
        .card-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
        .template-card { background:white; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.08); }
        .color-bar { height:8px; }
        .card-body { padding:20px; }
        .card-body h3 { font-size:16px; color:#1a1a2e; margin-bottom:4px; }
        .card-body .code { font-family:monospace; font-size:12px; color:#6b7280; }
        .card-body .details { margin-top:12px; font-size:13px; color:#374151; }
        .card-body .details span { display:block; margin-bottom:4px; }
        .card-actions { padding:12px 20px; border-top:1px solid #e5e7eb; display:flex; gap:8px; }
        .empty-state { text-align:center; padding:60px; background:white; border-radius:12px; }
        .color-dot { display:inline-block; width:16px; height:16px; border-radius:4px; vertical-align:middle; margin-right:4px; }
    </style>
</head>
<body>
<div class="navbar">
    <h1>📇 ID Card Management</h1>
    <div><a href="/">🏠 Home</a><a href="/web/profiles">👤 Profiles</a><a href="/web/templates">🎨 Templates</a></div>
</div>
<div class="container">
    <div class="header-bar">
        <h2>🎨 Card Templates</h2>
        <a href="/web/templates/new" class="btn btn-primary">+ New Template</a>
    </div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div class="card-grid" th:if="${!#lists.isEmpty(templates)}">
        <div class="template-card" th:each="t : ${templates}">
            <div class="color-bar" th:style="'background:linear-gradient(90deg,' + ${t.primaryColor} + ',' + ${t.secondaryColor} + ')'"></div>
            <div class="card-body">
                <h3 th:text="${t.name}">Template Name</h3>
                <div class="code" th:text="${t.code}">CODE</div>
                <div class="details">
                    <span>🏛️ <span th:text="${t.organizationName} ?: '-'">Org</span></span>
                    <span>📐 Layout: <span th:text="${t.layout}">VERTICAL</span></span>
                    <span th:if="${t.tagline}">💬 <span th:text="${t.tagline}">Tagline</span></span>
                    <span>🎨 Primary: <span class="color-dot" th:style="'background:'+${t.primaryColor}"></span><span th:text="${t.primaryColor}"></span></span>
                </div>
            </div>
            <div class="card-actions">
                <a th:href="@{'/web/templates/' + ${t.id} + '/delete'}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this template?')">🗑️ Delete</a>
            </div>
        </div>
    </div>
    <div th:if="${#lists.isEmpty(templates)}" class="empty-state"><p>No templates yet.</p></div>
</div>
</body>
</html>
