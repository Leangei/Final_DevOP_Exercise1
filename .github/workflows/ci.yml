name: CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven (skip tests)
        run: chmod +x mvnw && ./mvnw clean package -DskipTests

      - name: Run tests
        run: ./mvnw test

      # Upload JAR as artifact for deploy step
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: demo/target/demo-0.0.1-SNAPSHOT.jar

  notify-on-failure:
    name: Notify on Failure
    needs: build-and-test
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: '❌ Build FAILED - ${{ github.repository }}'
          to: srengty@gmail.com
          cc: ${{ github.event.head_commit.author.email || github.actor }}@users.noreply.github.com
          from: GitHub Actions CI
          body: |
            ## ❌ Build Failed
            
            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **Author:** ${{ github.event.head_commit.author.name || github.actor }}
            **URL:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            Please check the build logs for more details.

  deploy:
    name: Deploy with Ansible
    needs: build-and-test
    if: success()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: demo/target/

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Start Docker containers
        working-directory: demo
        run: docker compose up -d
        env:
          COMPOSE_IGNORE_ORPHANS: True

      - name: Wait for containers to be ready
        run: |
          echo "Waiting for web-server container..."
          until docker ps --filter name=web-server --format "{{.Names}}" | grep -q "web-server"; do
            sleep 2
          done
          echo "web-server is running"

      - name: Create /app directory in web-server container
        run: docker exec web-server mkdir -p /app

      - name: Copy application JAR to web-server
        working-directory: demo
        run: |
          docker cp target/demo-0.0.1-SNAPSHOT.jar web-server:/app/demo-0.0.1-SNAPSHOT.jar
          docker cp pom.xml web-server:/app/
          docker cp mvnw mvnw.cmd web-server:/app/
          [ -d .mvn ] && docker cp .mvn web-server:/app/.mvn/

      - name: Install Python Docker module for Ansible
        run: pip install docker

      - name: Run Ansible Playbook
        working-directory: demo
        run: |
          ansible-playbook -i Ansible/hosts.ini Ansible/deploy.yml -v
