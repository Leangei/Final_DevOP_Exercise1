name: CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: chmod +x mvnw && ./mvnw clean package -DskipTests

      - name: Run tests
        run: ./mvnw test

  notify-on-failure:
    name: Notify on Failure
    needs: build-and-test
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: '❌ Build FAILED - ${{ github.repository }} (${{ github.ref_name }})'
          to: srengty@gmail.com
          cc: ${{ github.event.head_commit.author.email || github.actor }}@users.noreply.github.com
          from: GitHub Actions CI
          body: |
            ## ❌ Build Failed

            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **Author:** ${{ github.event.head_commit.author.name || github.actor }}
            **URL:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Please check the build logs for more details.

  notify-on-success:
    name: Notify on Success
    needs: build-and-test
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Send success email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: '✅ Build SUCCESS - ${{ github.repository }} (${{ github.ref_name }})'
          to: srengty@gmail.com
          cc: ${{ github.event.head_commit.author.email || github.actor }}@users.noreply.github.com
          from: GitHub Actions CI
          body: |
            ## ✅ Build Succeeded

            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **Author:** ${{ github.event.head_commit.author.name || github.actor }}
            **Tests:** All tests passed
            **URL:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            The build completed successfully!